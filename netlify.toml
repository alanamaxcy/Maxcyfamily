[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev:ui"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

# API routes are served by the v2 functions' own `path` config; this catch-all
# only picks up everything left over, so the SPA can own its client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# The document must never be cached, or a home-screen app keeps booting an old
# build forever. Both paths are listed on purpose: a standalone PWA loads "/"
# (the manifest start_url) and Netlify matches header rules on the REQUEST path,
# so a rule for /index.html alone never fires for it.
[[headers]]
  for = "/"
  [headers.values]
    cache-control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    cache-control = "no-cache, no-store, must-revalidate"

# Read on every launch to decide whether a newer build exists.
[[headers]]
  for = "/version.json"
  [headers.values]
    cache-control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    cache-control = "no-cache"
