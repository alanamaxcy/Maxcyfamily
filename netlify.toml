[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev:ui"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

# API routes are served by the v2 functions' own `path` config; this catch-all
# only picks up everything left over, so the SPA can own its client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    cache-control = "no-cache"
